<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>html{color-scheme:light}body{margin:0}@media (prefers-color-scheme:dark){html:not([data-theme="light"]){color-scheme:dark}}</style>
<title>Jalur IELTS</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
/* Tema "kertas kotak-kotak": tinta navy, garis tebal, bayangan keras, label mono. Ada mode terang dan gelap. */
:root{
  --bg:#E9EFE2; --grid:#D3DCC8; --surface:#FCFDF8; --ink:#0F2040; --muted:#455470; --line:#C7D1C0; --edge:#0F2040;
  --accent:#2C58E0; --accent-ink:#FFFFFF; --amber:#F2B632; --navy:#0F2040; --navy-ink:#F4F7FB; --navy-dim:#93A5C3;
  --good:#1C8A5A; --good-bg:#DCEFE3; --bad:#CF3F3F; --bad-bg:#F8E2DF; --warn:#A8640A;
  --slate:#BCCBD8; --soft:#E1EADC; --sh:#BCCBD8; --on-bg:#0F2040; --on-ink:#FFFFFF;
  --board:#0F2040; --board-ink:#F2B632; --board-dim:#93A5C3;
  --f-display:"Space Grotesk","Segoe UI",system-ui,sans-serif;
  --f-body:"Inter","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1524; --grid:#13223A; --surface:#101F34; --ink:#E8EFF8; --muted:#B3C3DA; --line:#26395A; --edge:#3D557D;
  --accent:#86A8FF; --accent-ink:#0B1524; --amber:#F5C04A; --navy:#08111F; --navy-ink:#F4F7FB; --navy-dim:#7F93B2;
  --good:#4FD1A0; --good-bg:#0F2F29; --bad:#FF8383; --bad-bg:#36191F; --warn:#E3A84C;
  --slate:#223650; --soft:#16273F; --sh:#050B16; --on-bg:#86A8FF; --on-ink:#0B1524;
  --board:#08111F; --board-ink:#F5C04A; --board-dim:#7F93B2; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1524; --grid:#13223A; --surface:#101F34; --ink:#E8EFF8; --muted:#B3C3DA; --line:#26395A; --edge:#3D557D;
  --accent:#86A8FF; --accent-ink:#0B1524; --amber:#F5C04A; --navy:#08111F; --navy-ink:#F4F7FB; --navy-dim:#7F93B2;
  --good:#4FD1A0; --good-bg:#0F2F29; --bad:#FF8383; --bad-bg:#36191F; --warn:#E3A84C;
  --slate:#223650; --soft:#16273F; --sh:#050B16; --on-bg:#86A8FF; --on-ink:#0B1524;
  --board:#08111F; --board-ink:#F5C04A; --board-dim:#7F93B2; color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background-color:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:26px 26px;
  padding-block:0 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1080px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.12;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* header */
.top{position:relative;background:var(--navy);color:var(--navy-ink);margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:calc(22px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-left,0px)) 26px;border-bottom:4px solid var(--amber);
  background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:26px 26px}
.top .in{max-width:1080px;margin:0 auto;display:flex;flex-wrap:wrap;gap:18px 28px;align-items:flex-end;justify-content:space-between}
.kicker{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber)}
.top h1{font-size:clamp(34px,8vw,52px);font-weight:700;color:#fff;margin:6px 0 4px;letter-spacing:-.03em}
.top .sub{font-size:13px;color:var(--navy-dim)}
.wkbox{min-width:210px;display:grid;gap:8px}
.wkt{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--f-mono);font-size:12px;color:var(--navy-dim);text-transform:uppercase;letter-spacing:.08em}
.wkt b{font-size:20px;color:var(--amber);font-weight:700;letter-spacing:0}
.seg12{display:grid;grid-template-columns:repeat(12,1fr);gap:3px}
.seg12 i{height:10px;border-radius:2px;background:rgba(255,255,255,.14)}
.seg12 i.on{background:var(--amber)}
.seg12 i.now{background:#fff}
.sync{font-family:var(--f-mono);font-size:11px;color:var(--navy-dim);text-transform:uppercase;letter-spacing:.06em}

/* navigasi */
nav{position:sticky;top:0;z-index:30;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:12px 2px 12px;margin:0 -2px 14px;background:var(--bg);background-image:inherit;background-size:26px 26px;border-bottom:2px solid var(--edge)}
nav::-webkit-scrollbar{display:none}
nav button{display:inline-flex;align-items:center;gap:7px;background:var(--surface);border:2px solid var(--edge);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;white-space:nowrap;color:var(--ink)}
nav button svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
nav button[aria-selected="true"]{background:var(--on-bg);color:var(--on-ink);border-color:var(--on-bg);box-shadow:3px 3px 0 var(--amber)}

/* dasar */
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.panel{background:var(--surface);border:2px solid var(--edge);border-radius:10px;box-shadow:4px 4px 0 var(--sh);padding:18px;min-width:0}
.panel h2{font-size:20px;margin-bottom:10px}
.lbl{font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.big{font-family:var(--f-display);font-size:34px;font-weight:700;line-height:1.05;margin-top:6px}
.small{font-size:13px;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--accent);color:var(--accent-ink);border:2px solid var(--edge);border-radius:8px;padding:10px 18px;font-weight:700;box-shadow:3px 3px 0 var(--edge);transition:transform .08s,box-shadow .08s}
.btn:hover:not([disabled]){transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--edge)}
.btn:active:not([disabled]){transform:translate(3px,3px);box-shadow:0 0 0 var(--edge)}
.btn.ghost{background:var(--surface);color:var(--ink);box-shadow:none}
.btn.ghost:hover:not([disabled]){background:var(--soft);transform:none;box-shadow:none}
.btn.good{background:var(--good);color:#fff}
.btn.warn{background:var(--amber);color:#0F2040}
.btn.bad{background:var(--bad);color:#fff}
.btn.amber{background:var(--amber);color:#0F2040;border-color:#0F2040}
.btn[disabled]{opacity:.45;cursor:default;box-shadow:none}

/* hero hari ini */
.hero{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:center;justify-content:space-between;background:var(--navy);color:var(--navy-ink);border:2px solid var(--edge);border-radius:10px;box-shadow:5px 5px 0 var(--amber);padding:22px;
  background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:22px 22px}
.hero .kick{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--amber)}
.hero h2{font-size:clamp(26px,6vw,36px);color:#fff;margin:6px 0 6px}
.hero p{margin:0;color:var(--navy-dim);max-width:46ch;font-size:14px}
.stat{display:flex;flex-direction:column;gap:2px;position:relative}
.stat .lbl{padding-right:42px}
.stat .ic{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:8px;display:grid;place-items:center;background:var(--soft);border:2px solid var(--edge)}
.stat .ic svg{width:18px;height:18px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cta{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;text-align:left}
.cta h2{margin:0 0 4px;font-size:20px}
.cta.alt{background:var(--soft)}

.week{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}
.week div{border:2px solid var(--edge);border-radius:8px;padding:9px 2px;text-align:center;font-family:var(--f-mono);font-size:11px;color:var(--muted);background:var(--surface)}
.week div.on{background:var(--good);border-color:var(--edge);color:#fff;font-weight:700}
.week div.now{box-shadow:0 0 0 3px var(--amber)}

/* kosakata: poster + kartu */
.seg{display:inline-grid;grid-auto-flow:column;gap:0;border:2px solid var(--edge);border-radius:10px;overflow:hidden;background:var(--surface);margin-bottom:14px;max-width:100%}
.seg button{background:transparent;border:0;padding:9px 16px;font-weight:700;font-size:14px;color:var(--ink);white-space:nowrap}
.seg button+button{border-left:2px solid var(--edge)}
.seg button[aria-pressed="true"]{background:var(--on-bg);color:var(--on-ink)}
.poster{background:var(--surface);border:2px solid var(--edge);border-radius:10px;box-shadow:5px 5px 0 var(--sh);padding:22px 20px;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:26px 26px}
.poster h2{font-size:clamp(32px,8vw,48px);font-weight:700;letter-spacing:-.035em;margin-bottom:4px}
.poster .lead{margin:0 0 14px;color:var(--muted);font-size:13px}
.vl{list-style:none;margin:0;padding:0;display:grid;gap:0;counter-reset:v}
.vl li{display:grid;grid-template-columns:34px 1fr;gap:4px 8px;padding:13px 0;border-top:2px dashed var(--line);align-items:baseline}
.vl li:first-child{border-top:0}
.vl .n{font-family:var(--f-mono);font-weight:700;font-size:15px;color:var(--muted)}
.vl .w{font-family:var(--f-display);font-size:clamp(22px,5.5vw,28px);font-weight:700;letter-spacing:-.02em;overflow-wrap:anywhere}
.vl .p{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin:0 6px}
.vl .m{font-size:16px}
.vl .fm,.flash .fm{grid-column:2;font-family:var(--f-mono);font-size:13px}.flash .fm{grid-column:auto;margin:6px 0}.vl .fm b,.flash .fm b{color:var(--muted);font-weight:600;font-size:11px}.vl .fm i{font-style:normal;color:var(--muted)}.prn{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center}.pi{display:inline-flex;gap:6px;align-items:center}.pw{display:inline-flex;align-items:center;gap:6px}.ipa{font-family:var(--f-mono);font-size:14px;color:var(--muted)}.spk{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;border:2px solid var(--edge);background:var(--surface);color:var(--ink);cursor:pointer;padding:0}.spk:hover,.spk:focus-visible{background:var(--accent,#fbbf24);color:#111}.vl .prn{grid-column:2}.vl .x.tr{font-style:normal;margin-top:-2px}
.vl .x{grid-column:2;font-size:13px;color:var(--muted);font-style:italic}
.flash{display:grid;grid-template-columns:104px 1fr;background:var(--surface);border:2px solid var(--edge);border-radius:10px;box-shadow:5px 5px 0 var(--sh);min-height:250px;overflow:hidden}
.flash .stub{background:var(--navy);color:var(--amber);padding:16px 12px;font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;display:flex;flex-direction:column;justify-content:space-between;border-right:3px dashed var(--bg)}
.flash .stub b{font-size:24px;display:block;color:#fff;letter-spacing:0}
.flash .face{padding:22px;display:flex;flex-direction:column;justify-content:center;gap:10px;min-width:0;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:26px 26px}
.flash .word{font-family:var(--f-display);font-size:clamp(32px,8vw,44px);font-weight:700;letter-spacing:-.03em;overflow-wrap:anywhere}
.flash .pos{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.flash .mean{font-size:22px;font-weight:700}
.flash .ex{color:var(--muted);font-style:italic}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
@media (max-width:520px){.flash{grid-template-columns:1fr}.flash .stub{flex-direction:row;border-right:0;border-bottom:3px dashed var(--bg);align-items:center}}

/* formulir */
textarea,input[type=number],input[type=text],input[type=password],select{width:100%;background:var(--surface);border:2px solid var(--edge);border-radius:8px;padding:10px 12px;min-width:0}
textarea{min-height:260px;resize:vertical;line-height:1.65}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.timer{font-family:var(--f-mono);font-size:46px;font-weight:700;letter-spacing:.02em}
.timer.low{color:var(--bad)}
.card-cue{border:2px solid var(--edge);border-left:8px solid var(--amber);padding:14px 18px;background:var(--soft);border-radius:8px}
.card-cue ul{margin:6px 0 0;padding-left:20px}

table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:9px 6px;border-bottom:2px solid var(--line)}
th{font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:500}
td.n,th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
.bars{display:grid;gap:10px}
.bar{display:grid;grid-template-columns:84px 1fr 36px;gap:8px;align-items:center;font-size:13px}
.bar i{display:block;height:14px;background:var(--soft);border:2px solid var(--edge);border-radius:4px;position:relative}
.bar i span{position:absolute;inset:0 auto 0 0;background:var(--accent)}
.bar i em{position:absolute;top:-5px;bottom:-5px;width:3px;background:var(--amber);border-left:1px solid var(--edge)}
svg text{font-family:var(--f-mono);font-size:11px}
.gl{stroke:var(--line);stroke-width:1}
.tx{fill:var(--muted)}
.ln{fill:none;stroke:var(--accent);stroke-width:3}
.dot{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.tg{stroke:var(--amber);stroke-width:2.5;stroke-dasharray:6 4}
.tgt{fill:var(--warn);font-weight:700}
.empty{padding:22px;border:2px dashed var(--line);border-radius:8px;color:var(--muted);text-align:center}

/* ===== SOAL ===== */
.prog{display:flex;gap:3px;margin:12px 0 16px}
.prog i{flex:1;height:8px;border-radius:2px;background:var(--line)}
.prog i.d{background:var(--accent)}
.prog i.c{background:var(--good)}
.prog i.x{background:var(--bad)}
.prog i.n{background:var(--amber)}
.lv{display:flex;gap:8px;flex-wrap:wrap}
.lv button{background:var(--surface);border:2px solid var(--edge);border-radius:999px;padding:7px 16px;font-weight:700;font-size:14px}
.lv button[aria-pressed="true"]{background:var(--on-bg);color:var(--on-ink);box-shadow:3px 3px 0 var(--amber);border-color:var(--on-bg)}
.mode{--c:var(--accent);padding:0;overflow:hidden;display:flex;flex-direction:column}
.mode .bandt{background:var(--c);height:12px;border-bottom:2px solid var(--edge)}
.mode .bd{padding:16px 18px 18px;display:flex;flex-direction:column;gap:10px;flex:1}
.mode h3{font-size:24px}
.meter{height:12px;border:2px solid var(--edge);border-radius:4px;background:var(--soft);overflow:hidden}
.meter i{display:block;height:100%;background:var(--c)}
.case{background:var(--surface);border:2px solid var(--edge);border-radius:10px;box-shadow:5px 5px 0 var(--sh);padding:20px 18px;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:26px 26px}
.case-h{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.case-t{font-family:var(--f-display);font-size:clamp(22px,5.5vw,28px);font-weight:700;letter-spacing:-.02em}
.chip{font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;border:2px solid var(--edge);border-radius:999px;padding:3px 10px;background:var(--surface)}
.chip.lvl{background:var(--amber);color:#0F2040}
.passage{background:var(--surface);border:2px solid var(--edge);border-radius:8px;padding:16px 18px;margin:12px 0;line-height:1.75}
.passage h3{font-size:clamp(22px,5.5vw,28px);margin-bottom:8px}
.qh{font-family:var(--f-display);font-size:clamp(22px,5.5vw,30px);font-weight:600;line-height:1.28;margin:14px 0 18px;letter-spacing:-.015em}
.blank{display:inline-block;min-width:6.5ch;border-bottom:3px solid var(--ink);margin:0 4px;transform:translateY(2px)}
.fill{display:inline-block;border-bottom:3px solid var(--good);color:var(--good);padding:0 4px;margin:0 2px}
.ogrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.opt{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:var(--slate);border:2px solid var(--edge);border-radius:6px;padding:13px 14px;font-family:var(--f-mono);font-size:15px;min-width:0;color:var(--ink);box-shadow:3px 3px 0 var(--edge);transition:transform .08s,box-shadow .08s}
.opt .ol{flex:none;font-weight:700;opacity:.85}
.opt .ot{overflow-wrap:anywhere;min-width:0}
.opt:hover:not([disabled]){transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--edge)}
.opt:active:not([disabled]){transform:translate(3px,3px);box-shadow:0 0 0 var(--edge)}
.opt[disabled]{cursor:default;box-shadow:none;transform:none}
.opt.right{background:var(--good);color:#fff}
.opt.wrong{background:var(--bad);color:#fff}
.opt[disabled]:not(.right):not(.wrong){opacity:.55}
.reveal{margin-top:18px;display:grid;gap:16px}
.rv-top{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:620px){.rv-top{grid-template-columns:1fr}}
.ans{font-family:var(--f-display);font-size:clamp(20px,5vw,26px);font-weight:700;display:flex;gap:10px;align-items:flex-start;line-height:1.2}
.ans.ok{color:var(--good)}
.ans.no{color:var(--bad)}
.ans svg{flex:none;width:30px;height:30px}
.ans small{display:block;font-family:var(--f-body);font-size:13px;font-weight:500;color:var(--muted);margin-top:4px}
.rule{border:2px solid var(--edge);outline:2px solid var(--edge);outline-offset:3px;background:var(--slate);padding:12px 16px;border-radius:2px;margin:3px}
.rule-t{font-family:var(--f-display);font-size:clamp(20px,5vw,24px);font-weight:700}
.rule-p{font-family:var(--f-mono);font-size:13px;margin-top:4px}
.why{margin:0;font-size:15px;line-height:1.6}
.tl{background:var(--surface);border:2px solid var(--edge);border-radius:8px;padding:6px 10px}
.tl svg{display:block;width:100%;height:auto;max-height:150px}
.tl .ax{stroke:var(--accent);stroke-width:4}
.tl .ar{stroke:var(--amber);stroke-width:5;fill:none}
.tl .arh{fill:var(--amber)}
.tl .d1{fill:var(--amber);stroke:var(--edge);stroke-width:2}
.tl .d2{fill:var(--accent);stroke:var(--edge);stroke-width:2}
.tl .d3{fill:var(--muted);stroke:var(--edge);stroke-width:2}
.tl .lb{fill:var(--ink);font-size:11px}
.vf{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:2px solid var(--edge);border-radius:8px;overflow:hidden;background:var(--surface)}
.vf div{padding:10px 12px;border-left:2px solid var(--edge);display:flex;flex-direction:column;gap:2px;min-width:0}
.vf div:first-child{border-left:0}
.vf span{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;color:var(--muted)}
.vf b{font-family:var(--f-mono);font-size:15px;overflow-wrap:anywhere}
.vf .on{background:var(--amber);color:#0F2040}
.vf .on span{color:#0F2040}
.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:grid;gap:8px}

function call(body){
  return fetch(SYNC.url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(Object.assign({key:SYNC.key},body))})
    .then(function(r){return r.json()}).then(function(j){if(!j.ok)throw new Error(j.error||"error");return j});
}
function flush(){
  if(!syncOn()||saving||!dirty)return;
  saving=true;dirty=false;setSync("busy");
  call({action:"set",updated:S.updated,data:S}).then(function(){setSync("ok")},function(){dirty=true;setSync("fail")}).then(function(){saving=false});
}
function pull(){
  if(!syncOn()){setSync("off");return Promise.resolve()}
  setSync("busy");
  return call({action:"get"}).then(function(j){
    if(j.data&&(j.updated||0)>(S.updated||0)){S=normQ(Object.assign(def(),j.data));try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}render()}
    else if((S.updated||0)>(j.updated||0)){dirty=true;flush();return}
    setSync("ok");
  }).catch(function(){setSync("fail")});
}
function day(k){k=k||today();return S.daily[k]||(S.daily[k]={reviewed:0,newSeen:0,done:false})}
function active(k){var d=S.daily[k];return !!(d&&(d.reviewed>0||d.quiz>0||d.done))}
function streak(){var k=today(),n=0;if(!active(k))k=addDays(k,-1);while(active(k)){n++;k=addDays(k,-1)}return n}
function planWeek(){var t=today();if(t<START)return{n:0,lbl:"Mulai"};if(t>END)return{n:12,lbl:"Selesai"};return{n:Math.min(12,Math.floor(diff(START,t)/7)+1),lbl:"Minggu ke"}}
function avg(s){return Math.round((s.L+s.R+s.W+s.S)/4*2)/2}

/* flashcards */
var session=null;
function buildQueue(){
  var t=today(),due=[],fresh=[];
  VOCAB.forEach(function(v,i){var c=S.cards[i];if(!c)fresh.push(i);else if(c.due<=t)due.push(i)});
  var left=Math.max(0,NEW_PER_DAY-(day().newSeen||0));
  return due.concat(fresh.slice(0,left));
}
function dueCount(){return buildQueue().length}
function mastered(){var n=0;for(var k in S.cards){if(S.cards[k].box>=4)n++}return n}
function rate(r){
  var i=session.q[session.i],c=S.cards[i],t=today(),dd=day();
  if(!c){c={box:0,due:t};dd.newSeen=(dd.newSeen||0)+1}
  if(r==="again"){c.box=0;c.due=t;session.q.push(i)}
  else if(r==="hard"){c.box=Math.max(1,c.box);c.due=addDays(t,1)}
  else{c.box=Math.min(6,c.box+1);c.due=addDays(t,INTERVALS[c.box])}
  S.cards[i]=c;dd.reviewed=(dd.reviewed||0)+1;
  session.i++;session.flip=false;save();render();
}

/* chart */
function chart(){
  var sc=S.scores.slice(-12),W=640,H=230,L=34,R=18,Tp=16,B=30,lo=4,hi=9;
  function y(v){v=Math.max(lo,Math.min(hi,v));return Tp+(hi-v)/(hi-lo)*(H-Tp-B)}
  function x(i){return sc.length<2?L+(W-L-R)/2:L+i*(W-L-R)/(sc.length-1)}
  var g="";
  for(var v=lo;v<=hi;v++){g+='<line class="gl" x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'"/><text class="tx" x="'+(L-8)+'" y="'+(y(v)+4)+'" text-anchor="end">'+v+'</text>'}
  g+='<line class="tg" x1="'+L+'" x2="'+(W-R)+'" y1="'+y(S.target)+'" y2="'+y(S.target)+'"/><text class="tgt" x="'+(W-R)+'" y="'+(y(S.target)-6)+'" text-anchor="end">target '+S.target+'</text>';
  if(sc.length){
    var pts=sc.map(function(s,i){return x(i)+","+y(avg(s))}).join(" ");
    g+='<polyline class="ln" points="'+pts+'"/>';
    sc.forEach(function(s,i){g+='<circle class="dot" cx="'+x(i)+'" cy="'+y(avg(s))+'" r="5"/>'});
    var last=sc[sc.length-1],lx=x(sc.length-1),ly=y(avg(last));
    g+='<text class="tx" x="'+(lx>W-60?lx-10:lx+10)+'" y="'+(ly-10)+'" text-anchor="'+(lx>W-60?"end":"start")+'" style="fill:var(--ink);font-weight:500">'+avg(last).toFixed(1)+'</text>';
    g+='<text class="tx" x="'+x(0)+'" y="'+(H-8)+'" text-anchor="'+(sc.length>1?"start":"middle")+'">'+sc[0].d.slice(5).split("-").reverse().join("/")+'</text>';
    if(sc.length>1)g+='<text class="tx" x="'+x(sc.length-1)+'" y="'+(H-8)+'" text-anchor="end">'+last.d.slice(5).split("-").reverse().join("/")+'</text>';
  }
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Grafik rata-rata band per tes dibanding target">'+g+'</svg>';
}

{t:"Transportasi kereta malam",l:"B2",x:"Night trains, once thought to be a thing of the past, are returning across Europe. Rising concern about air travel emissions has persuaded several governments to fund new sleeper routes. Passengers can board in the evening, sleep in a small cabin and arrive in the city centre the next morning, avoiding airport queues. However, tickets are often more expensive than budget flights, and the journeys can take up to fourteen hours. Rail companies say the cost is high because the carriages are old and must be replaced. Even so, bookings on the new routes have exceeded expectations, and two additional lines are planned for next year.",q:[

{t:"Tidur dan remaja",l:"B2",x:"Many teenagers do not get enough sleep, and scientists believe that early school start times are partly responsible. During adolescence the body clock shifts, so young people naturally feel sleepy later in the evening and wake later in the morning. A school that moved its first lesson from 8.00 to 9.00 reported fewer late arrivals and a small improvement in attendance. Not everyone agrees with the change, however. Some parents argue that later finishing times interfere with sport and part-time jobs. Researchers stress that screens also play a role, and recommend that phones be left outside the bedroom at night.",q:[

{t:"Kerja jarak jauh dan kota kecil",l:"B2",x:"As more companies allow staff to work from home, some small towns are attracting new residents who no longer need to commute to a large city. Property prices in these places are lower, and many people appreciate the slower pace of life. Local councils have welcomed the newcomers, since they spend money in shops and cafés. On the other hand, long-term residents complain that house prices have started to rise and that young local people cannot afford to buy. In response, one council has set aside land for affordable housing. It is still too early to say whether the trend will last, as some employers are now asking workers to return to the office.",q:[

{t:"Daur ulang plastik",l:"B2",x:"Although most households separate their plastic waste, only a small proportion of it is actually recycled. Different types of plastic cannot be mixed, and food residue can spoil a whole batch. As a result, large amounts are burned or sent abroad. Some companies are now designing packaging from a single material to make recycling easier. Environmental groups welcome the change but argue that reducing the amount of plastic produced is more effective than improving recycling. A recent report estimated that a ban on certain single-use items could cut plastic waste by a third within five years, a claim that manufacturers dispute.",q:[

{t:"Keterbatasan kecerdasan buatan dalam penerjemahan",l:"C1",x:"Machine translation has improved dramatically, to the point where routine business correspondence can often be rendered with few errors. Nevertheless, professional translators remain unconvinced that their craft is obsolete. Idioms, humour and cultural references continue to pose difficulties, because they depend on shared assumptions that no dataset can fully capture. Moreover, errors are not always obvious: a fluent but inaccurate sentence may pass unnoticed by a reader who does not know the source language. For this reason, many agencies now employ translators not to produce text from scratch but to review machine output, a role some regard as less rewarding yet increasingly indispensable.",q:[

{t:"Ekonomi perhatian",l:"C1",x:"The notion that human attention is a scarce commodity has given rise to what some economists call the attention economy. Platforms compete not for money directly but for the minutes users devote to them, since those minutes can be sold to advertisers. Design features such as endless scrolling and notifications are widely believed to exploit psychological tendencies, although companies maintain that they merely improve convenience. A growing number of researchers contend that the cumulative effect is a fragmentation of concentration, with people finding it harder to read for long stretches. Others caution that evidence of lasting harm is still inconclusive, and that similar fears accompanied the arrival of television.",q:[
["t","Platforms compete for the time users spend on them.",null,0,"Teks: compete for the minutes users devote. True."],

{t:"Kota tahan banjir",l:"C1",x:"Faced with ever more frequent flooding, several coastal cities are abandoning the idea that water can simply be kept out. Instead, planners are creating parks, wetlands and canals designed to absorb excess rainfall and release it slowly. Such 'sponge city' schemes are cheaper than massive sea walls, and they offer recreational space in normal times. Critics, however, point out that the approach requires land, which is scarce and expensive in dense centres, and that it cannot withstand the most extreme storms. Proponents concede the limitation but argue that a combination of soft and hard defences offers the most resilient protection for the money.",q:[
["t","Sponge city schemes are designed to absorb rainwater.",null,0,"Teks: absorb excess rainfall and release it slowly. True."],

{t:"Bahasa yang terancam punah",l:"C1",x:"Linguists estimate that about half of the world's languages may disappear by the end of the century. The loss is rarely sudden: it typically occurs over generations, as parents choose to raise children in a dominant language that promises better economic prospects. Each language embodies a distinct way of categorising experience, and its extinction therefore represents the loss of knowledge, including detailed ecological understanding accumulated over centuries. Revitalisation programmes have had mixed success. Immersion schools have produced fluent young speakers in some communities, but without everyday use outside the classroom, fluency tends to fade. Success appears to depend less on funding than on the community's own determination.",q:[

{t:"Menunda kepuasan",l:"C1",x:"A famous series of experiments offered young children a single sweet immediately or two if they could wait. Early follow-up studies suggested that those who waited went on to achieve better results in later life, and the findings were widely cited as evidence for the importance of self-control. More recent research, however, has complicated the picture. When differences in family background were taken into account, the link between waiting and later success weakened considerably. It seems that a child's willingness to wait may reflect trust that adults keep their promises as much as an inherent ability to resist temptation. Consequently, psychologists now caution against treating the result as a simple measure of character.",q:[
["t","Children were offered one sweet now or two later.",null,0,"Teks: a single sweet immediately or two if they could wait. True."],

["m","What do psychologists now advise?",["Not treating it as a simple measure of character","Repeating the test yearly","Banning the test","Rewarding patience"],0,"Kalimat terakhir."]]},
{t:"Penerbangan jarak jauh dan emisi",l:"C1",x:"Aviation accounts for a modest share of global emissions, yet its growth is the fastest of any transport sector, and decarbonising it is notoriously difficult. Batteries are too heavy for long flights, and sustainable fuels remain scarce and several times more expensive than conventional kerosene. Some analysts therefore argue that technology alone will not suffice and that demand must be managed, perhaps through higher taxes on frequent flyers. The industry counters that such measures would penalise ordinary families while doing little to cut emissions overall. What both sides accept is that credible offsets, which are frequently criticised for overstating their benefits, cannot be relied on to close the gap.",q:[
["t","Aviation is the fastest-growing transport sector in terms of emissions.",null,0,"Teks: its growth is the fastest of any transport sector. True."],
["t","Batteries are suitable for long flights.",null,1,"Teks: too heavy for long flights. False."],
["t","Sustainable fuels will become cheaper than kerosene by 2030.",null,2,"Tidak ada prediksi harga. Not Given."],
["m","What do some analysts propose?",["Managing demand, such as taxing frequent flyers","Banning aircraft","Using only batteries","Ignoring emissions"],0,"Teks: demand must be managed."],
["m","What do both sides agree on?",["Offsets cannot be relied on to close the gap","Taxes must rise","Fuel is cheap","Flights are declining"],0,"Kalimat terakhir."]]},
{t:"Kerja tim dan keputusan",l:"C1",x:"Conventional wisdom holds that groups make better decisions than individuals, since they pool a wider range of knowledge. Research, however, paints a more nuanced picture. Groups often converge prematurely on the first plausible option, particularly when a senior member speaks early and others hesitate to disagree. Some organisations have therefore adopted the practice of asking everyone to write down their view before discussion begins. Preliminary evidence suggests that this simple step increases the variety of ideas considered, although it does not guarantee a better outcome. Sceptics add that no procedure can substitute for a culture in which dissent is genuinely welcomed rather than merely tolerated.",q:[
["t","Groups are believed to benefit from combining knowledge.",null,0,"Teks: pool a wider range of knowledge. True."],
["t","Senior members rarely influence group decisions.",null,1,"Teks: groups converge when a senior member speaks early. False."],

["m","What is the effect of writing views down first?",["It increases the variety of ideas","It guarantees a better outcome","It shortens meetings","It removes seniority"],0,"Teks: increases the variety of ideas, tetapi tidak menjamin hasil."],
["m","What do sceptics say?",["Culture matters more than procedure","Procedures always work","Dissent is harmful","Groups should be smaller"],0,"Kalimat terakhir."]]}

{t:"Pekerja lepas",l:"B2",x:"The number of freelance workers has grown steadily, helped by online platforms that match clients with specialists. Freelancers value the freedom to choose their projects and to work from any place. On the other hand, their income can be irregular, and they do not receive paid holidays or sick pay. A survey of designers found that those who built a long-term relationship with a few clients felt more secure than those who searched for new work every week. Experts therefore advise newcomers to save a few months of expenses before leaving a permanent job.",q:[

{t:"Museum dan teknologi",l:"B2",x:"Museums are experimenting with technology to attract younger visitors. Some offer apps that let guests point a phone at an object and see a three-dimensional reconstruction. Others provide virtual tours so that people who live far away can explore the collection online. Curators say that digital tools should add to, not replace, the experience of seeing real objects. Attendance at one museum rose by a quarter after it introduced an interactive map, though staff note that the rise may also reflect a popular exhibition held in the same year.",q:[

{t:"Makan di kantin sekolah",l:"B2",x:"School canteens have changed their menus in response to concerns about child health. Fried snacks and sugary drinks have been replaced by fruit, salads and water in many places. Dietitians approve, but canteen managers report that sales have dropped, because some pupils simply bring food from home or buy sweets on the way to school. One school solved the problem by involving pupils in choosing the new dishes, and sales recovered within a term. The head teacher believes that children eat what they have helped to select.",q:[

{t:"Penghematan listrik rumah",l:"B2",x:"Energy bills have risen sharply, and households are searching for ways to cut consumption. Experts say that heating accounts for the largest share of use, so better insulation can bring the biggest savings. Replacing old light bulbs with LED ones also helps, although the effect is smaller. Smart meters, which display usage in real time, encourage people to switch off unnecessary devices. A trial involving five hundred homes found that families with smart meters reduced their consumption by about seven per cent. The researchers note that the effect faded for some families after several months.",q:[

{t:"Hewan peliharaan dan kesehatan",l:"B2",x:"Many people believe that pets improve the health of their owners. Dog owners, for instance, walk more than other people, which helps their fitness. Cat owners report lower stress after stroking their animals. Nevertheless, scientists urge caution. Healthier people may simply be more likely to adopt a pet, so it is hard to prove that the animal causes the benefit. A long-term study is following several thousand families to find clearer evidence. Meanwhile, doctors say that pets can be a source of companionship, which is valuable in itself.",q:[

{t:"Wisata berkelanjutan",l:"C1",x:"The surge in international tourism has brought prosperity to many coastal communities, yet it has also placed considerable strain on fragile ecosystems. Coral reefs, in particular, suffer from the sunscreen, anchors and careless divers that accompany visitors. Several destinations have responded by capping daily numbers and charging an environmental levy, the proceeds of which fund conservation. Proponents contend that such measures preserve the very attractions on which local livelihoods depend. Sceptics, by contrast, fear that higher costs will exclude all but the wealthiest travellers, thereby turning natural heritage into a privilege.",q:[
["t","Coral reefs are harmed by some of the things visitors bring.",null,0,"Teks: sunscreen, anchors, careless divers. True."],

["m","What do proponents argue?",["Limits protect the attractions locals depend on","Tourism should end","Levies are unfair","Reefs are not fragile"],0,"Teks: preserve the very attractions."]]},
{t:"Kecerdasan buatan di rumah sakit",l:"C1",x:"Hospitals are increasingly turning to algorithms to interpret scans, and early results suggest that, for certain conditions, the software detects abnormalities as reliably as specialists. Advocates stress that this could shorten waiting times, particularly in regions where radiologists are scarce. Nevertheless, clinicians remain wary. They point out that the systems are trained on historical data, which may under-represent minority groups, and that an incorrect diagnosis raises awkward questions about accountability. For these reasons, most institutions treat the technology as an aid to, rather than a substitute for, human judgement.",q:[
["t","Some software detects abnormalities as reliably as specialists.",null,0,"Teks: as reliably as specialists for certain conditions. True."],
["t","Radiologists are plentiful in every region.",null,1,"Teks: scarce in some regions. False."],

{t:"Urbanisasi dan perumahan",l:"C1",x:"As populations drift towards cities, housing has become one of the most pressing policy dilemmas. Rents in prime districts have outpaced wages for a decade, forcing many workers to commute long distances. Governments have tried rent controls, which protect sitting tenants but, according to economists, discourage landlords from maintaining or building properties. Others advocate relaxing planning rules so that denser developments can be approved more swiftly. Opponents of densification worry about congestion and the loss of neighbourhood character, but few deny that the status quo is unsustainable.",q:[

{t:"Ingatan dan teknologi digital",l:"C1",x:"The ease with which smartphones store information has prompted speculation that human memory is being quietly eroded. Psychologists have documented the so-called Google effect: people recall less of what they believe can be retrieved later. Yet some researchers interpret this not as decline but as adaptation, arguing that individuals simply allocate their mental effort differently, remembering where information is kept rather than the information itself. Whether such a strategy is advantageous depends on the reliability of the devices, a point on which evidence remains inconclusive.",q:[

["m","What does the benefit of the strategy depend on?",["The reliability of devices","The age of users","The price of phones","The size of memory"],0,"Teks: depends on the reliability of the devices."]]},
{t:"Energi angin lepas pantai",l:"C1",x:"Offshore wind farms have expanded rapidly, driven by falling costs and steadier winds at sea. Turbines located far from shore can generate power for a greater proportion of the year than their onshore counterparts. The principal obstacles are logistical: installing foundations in deep water demands specialised vessels, and connecting remote arrays to the grid requires long and expensive cables. Fishing communities have also voiced concern about restricted access. Developers respond that turbines can act as artificial reefs, although the long-term impact on marine life is still being assessed.",q:[
["t","Winds at sea tend to be steadier than on land.",null,0,"Teks: steadier winds at sea. True."],
["t","Installation in deep water needs no special vessels.",null,1,"Teks: demands specialised vessels. False."],
["t","Onshore wind farms are cheaper to build.",null,2,"Perbandingan biaya bangun tidak ada. Not Given."],

["m","What is the main obstacle for offshore wind?",["Logistics of foundations and cables","Lack of wind","Public opposition only","Short lifespan"],0,"Teks: principal obstacles are logistical."]]},
{t:"Pendidikan tinggi dan biaya",l:"C1",x:"The cost of university tuition has risen faster than inflation in many countries, leaving graduates with substantial debt. Defenders of the system argue that degree holders still earn considerably more over a lifetime, so the investment pays for itself. Critics counter that this average conceals wide disparities between subjects and institutions, and that some graduates never recover the outlay. A growing number of employers have dropped degree requirements for certain roles, favouring demonstrable skills instead. Whether this signals a lasting shift or a response to labour shortages remains to be seen.",q:[

{t:"Bahasa yang terancam punah",l:"C1",x:"Linguists estimate that roughly half of the world's languages could disappear by the end of the century. Most are spoken by small communities whose younger members increasingly adopt a dominant language for work and schooling. The loss is not merely linguistic: each language encodes a distinctive body of knowledge about local plants, weather and tradition. Revitalisation programmes, such as immersion nurseries run by elders, have achieved modest success. Nonetheless, specialists caution that without consistent support from governments, such efforts rarely outlast their founders.",q:[

{t:"Ekonomi berbagi",l:"C1",x:"Platforms that allow individuals to rent out spare rooms, cars and tools have been hailed as a more efficient use of existing resources. Participants earn supplementary income, while consumers gain cheaper alternatives to traditional providers. Regulators, however, are uneasy. Established hotels and taxi firms complain that they are bound by rules from which the platforms are exempt, and residents of popular districts report that short-term lets have driven up rents. Several cities have responded by limiting the number of nights a property may be let, with mixed results.",q:[

{t:"Penelitian di Antartika",l:"C1",x:"Scientists working in Antarctica draw ice cores that preserve a record of the atmosphere stretching back hundreds of thousands of years. Trapped bubbles of air reveal past concentrations of greenhouse gases, enabling researchers to compare today's levels with those of earlier eras. The work is arduous: teams endure extreme cold, and the logistics of transporting equipment are formidable. Even so, the data have proved indispensable for testing climate models. Researchers emphasise that the cores also show how abruptly the climate has shifted in the past, a finding that tempers any assumption of gradual change.",q:[

{t:"Etika riset genetika",l:"C1",x:"Advances in gene-editing technology have raised hopes of curing inherited diseases, but they have also provoked intense ethical debate. Editing the cells of an adult affects only that individual, whereas changes to embryos would be passed on to future generations. Many scientists therefore support a moratorium on heritable editing until safety and consent can be addressed. Others argue that a blanket prohibition would deny families the chance to avoid devastating conditions. The disagreement is compounded by the fact that regulations differ widely between countries, making coordinated oversight difficult.",q:[

  var it=qs.items[qs.i],n=qs.items.length,done=qs.picked!==null,num=pad(qs.i+1),L="ABCD",
    ttl=it.k==="grammar"?"Kasus Diagnostik":it.k==="vocab"?"Kasus Kosakata":"Kasus Bacaan",p="";
  var prog='<div class="prog" aria-hidden="true">'+qs.items.map(function(_,j){return '<i class="'+(j<qs.res.length?(qs.res[j].ok?"c":"x"):j===qs.i?"n":"")+'"></i>'}).join("")+'</div>';
  if(it.k==="reading"){var P=RP[it.p];p='<div class="passage"><div class="lbl" style="margin-bottom:6px">Teks &middot; '+P.l+'</div><h3>'+esc(P.t)+'</h3><div>'+esc(P.x)+'</div></div>'}
  var opts=qs.perm.map(function(orig,i){
    var cls="opt";if(done){if(orig===it.a)cls+=" right";else if(i===qs.picked)cls+=" wrong"}
    return '<button class="'+cls+'" data-opt="'+i+'"'+(done?" disabled":"")+'><span class="ol">['+L.charAt(i)+']</span><span class="ot">'+esc(it.o[orig])+'</span></button>';
  }).join("");
  var rv="";
  if(done){
    var cl=L.charAt(qs.perm.indexOf(it.a)),G=gm(it.id)||(it.tf?gmAuto(it):null);
    var ans='<div class="ans '+(qs.ok?"ok":"no")+'">'+(qs.ok?icoOk():icoNo())+'<div>Jawaban: ['+cl+'] '+esc(it.o[it.a])+(qs.ok?'<small>Tepat.</small>':'<small>Anda memilih ['+L.charAt(qs.picked)+'] '+esc(it.o[qs.perm[qs.picked]])+'.</small>')+'</div></div>';
    var rule=G?'<div class="rule"><div class="rule-t">'+esc(G.t)+'</div><div class="rule-p">Pola: '+esc(G.p)+'</div></div>':"";
    rv='<div class="reveal"><div class="rv-top" style="'+(G?"":"grid-template-columns:1fr")+'">'+ans+rule+'</div><p class="why">'+esc(it.e)+'</p>';
    var X=it.k==="grammar"?gx(it.id):null;if(X)rv+=gxHtml(X);
    var V=it.k==="vocab"?vxm(it.id):null,vf=!!V;if(V)rv+=vxHtml(V,it.o[0]);
    if(G&&G.ev)rv+='<div><h3 class="sec-t">Garis Waktu</h3><div class="tl">'+tlSvg(G.ev)+'</div></div>';
    if(G){
      rv+='<div><h3 class="sec-t">Matriks Eliminasi '+num+'</h3><div class="mx"><div class="mx-r mx-th"><span>Opsi</span><span>Status</span><span>'+(it.k==="vocab"?"Arti":it.k==="reading"?"Dasar":"Bentuk")+'</span><span>Alasan logis</span></div>'
        +qs.perm.map(function(orig,i){var ok=orig===it.a;return '<div class="mx-r'+(ok?" ok":"")+(qs.picked===i?" pick":"")+'"><span class="o">['+L.charAt(i)+'] '+esc(it.o[orig])+'</span><span class="s" style="color:var(--'+(ok?"good":"bad")+')">'+(ok?icoOk():icoNo())+'</span><span class="f">'+esc(vf?(ok?(G.l[0]||"Jawaban benar"):V.d[orig-1].l):formOf(G,it,orig))+'</span><span class="a">'+esc(vf?(ok?V.us:V.d[orig-1].r):(ok?it.e:G.r[orig]))+'</span></div>'}).join("")+'</div></div>';
    }
    rv+='<div class="row"><button class="btn" id="qNext">'+(qs.i+1>=n?"Lihat hasil":"Kasus berikutnya")+'</button></div></div>';
  }
  return '<div class="case"><div class="case-h"><div class="case-t">'+ttl+' '+num+'</div><div class="row" style="gap:8px"><span class="chip lvl">'+it.lv+'</span><span class="chip">'+esc(it.cat)+'</span><span class="chip mono">'+(qs.i+1)+'/'+n+'</span>'+(qs.timed?'<span class="chip tm" id="qTimer">'+fmtT(qs.end-Date.now())+'</span>':'')+'<button class="btn ghost" id="qMenu" style="padding:5px 12px;font-size:13px">Keluar</button></div></div>'
    +prog+p
    +(it.tf?'<p class="small" style="margin:0 0 6px">Sesuai teks: True = sesuai, False = bertentangan, Not Given = tidak disebut.</p>':"")
    +'<div class="qh">'+blankify(it.q,done?it.o[it.a]:"")+'</div><div class="ogrid">'+opts+'</div>'+rv+'</div>';
}
function soalDone(){
  var n=qs.res.length,c=qs.res.filter(function(r){return r.ok}).length,pc=n?Math.round(c/n*100):0;
  var msg=pc>=85?"Sangat baik. Coba level atau jenis soal yang lebih sulit.":pc>=65?"Cukup kuat. Ulangi soal yang salah di bawah ini.":"Masih banyak yang perlu diperkuat. Baca penjelasan di bawah, lalu ulangi sesi.";
  var wrong=qs.res.filter(function(r){return !r.ok}).map(function(r){var x=BID[r.id];return '<div class="wr"><div style="font-weight:700;margin-bottom:4px">'+blankify(x.q,x.o[x.a])+'</div><div class="small">Jawaban: <b>'+esc(x.o[x.a])+'</b>. '+esc(x.e)+'</div></div>'}).join("");
  var tn=qs.timed?'<p class="small" style="margin:0 0 10px">'+(qs.expired?'Waktu habis. '+n+' dari '+qs.items.length+' soal sempat dijawab; sisanya tidak dihitung.':'Selesai dalam '+fmtT(Date.now()-(qs.end-TLIM*1000))+' dari batas '+fmtT(TLIM*1000)+'.')+'</p>':'';
  return '<div class="panel"><div class="lbl">'+KIND[qs.kind]+' &middot; sesi selesai'+(qs.timed?' &middot; berwaktu':'')+'</div>'+tn
    +'<div class="row" style="gap:22px;margin:12px 0 16px;flex-wrap:nowrap"><div class="ring" style="--p:'+pc+'"><b>'+pc+'%</b></div><div><div class="big">'+c+'/'+n+' <span class="small">benar</span></div><p style="margin:6px 0 0">'+msg+'</p></div></div>'
    +'<div class="row"><button class="btn" id="qAgain">Sesi berikutnya</button><button class="btn ghost" id="qMenu">Kembali ke menu</button></div>'
    +(wrong?'<h2 style="margin:22px 0 4px;font-size:20px">Yang perlu diulang ('+(n-c)+')</h2>'+wrong:'<p class="small" style="margin:14px 0 0">Semua benar.</p>')+'</div>';
}
function bindSoal(){
  var $=function(id){return document.getElementById(id)};
  document.querySelectorAll("[data-start]").forEach(function(b){b.onclick=function(){startQuiz(b.dataset.start);render()}});
  document.querySelectorAll("[data-opt]").forEach(function(b){b.onclick=function(){answer(+b.dataset.opt)}});
  document.querySelectorAll("[data-lv]").forEach(function(b){b.onclick=function(){state.ql=b.dataset.lv;render()}});
  if($("qNext"))$("qNext").onclick=nextQ;
  if($("qMenu"))$("qMenu").onclick=function(){qs=null;render()};
  if($("tmChk"))$("tmChk").onchange=function(){state.timed=this.checked};
  if($("qAgain"))$("qAgain").onclick=function(){startQuiz(qs.kind);render()};
}

window.JI={bid:function(i){return BID[i]},all:function(){return BANK},gm:gm,gx:gx,vx:vxm,set:function(ids){qs.items=ids.map(function(i){return BID[i]}).concat(qs.items.slice(ids.length));qs.perm=makePerm(qs.items[0]);render()}};
function vSalah(){
  var sk=state.errSkill||"Reading",opts=Object.keys(ERR).map(function(k){return '<option'+(k===sk?" selected":"")+'>'+k+'</option>'}).join("");
  var types=ERR[sk].map(function(t){return '<option>'+esc(t)+'</option>'}).join("");
  var cnt={};S.errors.forEach(function(e){var k=e.s+" - "+e.t;cnt[k]=(cnt[k]||0)+1});
  var top=Object.keys(cnt).sort(function(a,b){return cnt[b]-cnt[a]}).slice(0,5),max=top.length?cnt[top[0]]:1;
  var bars=top.map(function(k){return '<div class="bar" style="grid-template-columns:150px 1fr 28px"><span>'+esc(k)+'</span><i><span style="width:'+(cnt[k]/max*100)+'%"></span></i><b class="mono">'+cnt[k]+'</b></div>'}).join("");
  var rows=S.errors.slice().reverse().slice(0,15).map(function(e,j){var idx=S.errors.length-1-j;return '<tr><td>'+e.d.slice(8)+'/'+e.d.slice(5,7)+'</td><td>'+esc(e.s)+'</td><td>'+esc(e.t)+'</td><td>'+esc(e.n||"")+'</td><td><button class="btn ghost" data-edel="'+idx+'">Hapus</button></td></tr>'}).join("");
  return '<div class="grid g2"><div class="panel"><h2>Catat kesalahan</h2><form id="errForm" class="grid"><div class="field"><label for="eS">Skill</label><select id="eS">'+opts+'</select></div><div class="field"><label for="eT">Jenis kesalahan</label><select id="eT">'+types+'</select></div><div class="field"><label for="eN">Catatan (opsional)</label><input id="eN" type="text" maxlength="160" style="width:100%;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:10px" placeholder="Contoh: Cambridge 17 Test 2, Passage 3"></div><div><button class="btn" type="submit">Tambah</button></div></form></div>'
   +'<div class="panel"><h2>Kesalahan terbanyak</h2>'+(top.length?'<div class="bars">'+bars+'</div><p class="small" style="margin:12px 0 0">Fokus minggu ini: <b>'+esc(top[0])+'</b>. Latih jenis ini lebih dulu.</p>':'<div class="empty">Belum ada catatan. Setiap selesai latihan, catat 1-3 kesalahan utama.</div>')+'</div></div>'
   +(rows?'<div class="panel" style="margin-top:12px"><h2>Catatan terbaru</h2><div class="scroll"><table><thead><tr><th>Tgl</th><th>Skill</th><th>Jenis</th><th>Catatan</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div></div>':"");
}
function vAtur(){
  return '<div class="grid g2"><div class="panel"><h2>Sinkron ke Google Sheets</h2><p class="small" style="margin-top:0">Isi alamat web app Apps Script dan kunci rahasia (lihat PANDUAN.md). Pengaturan ini hanya disimpan di perangkat ini, jadi isi di setiap perangkat.</p>'
   +'<div class="field"><label for="syUrl">Alamat web app</label><input id="syUrl" type="text" value="'+esc(SYNC.url)+'" placeholder="https://script.google.com/macros/s/.../exec" style="width:100%;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:10px"></div>'
   +'<div class="field" style="margin-top:8px"><label for="syKey">Kunci rahasia</label><input id="syKey" type="password" value="'+esc(SYNC.key)+'" autocomplete="off" style="width:100%;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:10px"></div>'
   +'<div class="row" style="margin-top:12px"><button class="btn" id="syoSave">Simpan dan tes</button><button class="btn ghost" id="syoNow">Sinkron sekarang</button></div><p class="small" id="syMsg" style="margin:8px 0 0"></p></div>'
   +'<div class="panel"><h2>Cadangan manual</h2><p class="small" style="margin-top:0">Unduh semua progres sebagai file, atau pulihkan dari file cadangan.</p><div class="row"><button class="btn ghost" id="bkOut">Unduh cadangan</button><label class="btn ghost" for="bkIn" style="display:inline-block">Pulihkan dari file</label><input id="bkIn" type="file" accept="application/json,.json" hidden></div><p class="small" id="bkMsg" style="margin:8px 0 0"></p></div></div>';
}
function render(){
  var tabs=document.getElementById("tabs");
  tabs.innerHTML=TABS.map(function(t){return '<button role="tab" aria-selected="'+(state.tab===t[0])+'" data-tab="'+t[0]+'">'+ico(t[0])+t[1]+'</button>'}).join("");
  var wk=planWeek();document.getElementById("wkLbl").textContent=wk.lbl;document.getElementById("wkNum").textContent=wk.n?wk.n+" / 12":"--";
  document.getElementById("tgtTop").textContent=S.target;
  var sg="",q;for(q=1;q<=12;q++)sg+='<i class="'+(q<wk.n?"on":q===wk.n?"now":"")+'"></i>';document.getElementById("wkSeg").innerHTML=sg;
  var v=document.getElementById("view");
  v.innerHTML=state.tab==="hari"?vHari():state.tab==="kata"?vKata():state.tab==="soal"?vSoal():state.tab==="tulis"?vTulis():state.tab==="salah"?vSalah():state.tab==="atur"?vAtur():vBicara();
  bind();
}
function go(t){if(state.tab!==t){stopTimer();T.left=0}state.tab=t;if(t==="kata")session=null;render()}

function bind(){
  var $=function(id){return document.getElementById(id)};
  if(state.tab==="soal")bindSoal();
  document.querySelectorAll("[data-tab]").forEach(function(b){b.onclick=function(){go(b.dataset.tab)}});
  document.querySelectorAll("[data-go]").forEach(function(b){b.onclick=function(){go(b.dataset.go)}});
  if($("doneBtn"))$("doneBtn").onclick=function(){var d=day();d.done=!d.done;save();render()};
  document.querySelectorAll("[data-km]").forEach(function(b){b.onclick=function(){state.km=b.dataset.km;session=null;render()}});
  document.querySelectorAll("[data-r]").forEach(function(b){b.onclick=function(){rate(b.dataset.r)}});
  if($("flip"))$("flip").onclick=function(){session.flip=true;render()};
  if($("resetSess"))$("resetSess").onclick=function(){session=null;render()};
  if($("essay")){
    var ta=$("essay");
    ta.oninput=function(){state.draft=ta.value;try{localStorage.setItem(LS+"-draft",state.draft)}catch(e){}var n=state.draft.trim()?state.draft.trim().split(/\s+/).length:0;$("wc").textContent=n+" kata"};
    $("newPrompt").onclick=function(){state.wp=rnd(WRITING.length,state.wp);$("prompt").textContent=WRITING[state.wp]};
    $("tStart").onclick=function(){
      if(T.run){stopTimer();render();return}
      startTimer(T.left>0?T.left:2400,function(){render()});render();
    };
    $("tReset").onclick=function(){stopTimer();T.left=0;render()};
    $("clearEssay").onclick=function(){state.draft="";try{localStorage.removeItem(LS+"-draft")}catch(e){}render()};
    $("copyEssay").onclick=function(){
      var txt="Soal: "+WRITING[state.wp]+"\n\nEsai saya ("+(state.draft.trim()?state.draft.trim().split(/\s+/).length:0)+" kata):\n"+state.draft+"\n\nTolong nilai berdasarkan band descriptor IELTS Writing Task 2 (Task Response, Coherence, Lexical Resource, Grammar) dan beri 3 perbaikan terpenting.";
      var done=function(ok){$("copyMsg").textContent=ok?"Tersalin. Tempel ke obrolan dengan Claude.":"Gagal menyalin otomatis. Blok teks esai lalu salin manual."};
      if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(function(){done(true)},function(){done(false)});else done(false);
    };
  }
  if($("errForm")){
    $("eS").onchange=function(){state.errSkill=$("eS").value;render()};
    $("errForm").onsubmit=function(e){e.preventDefault();S.errors.push({d:today(),s:$("eS").value,t:$("eT").value,n:$("eN").value.trim()});save();render()};
    document.querySelectorAll("[data-edel]").forEach(function(b){b.onclick=function(){if(b.dataset.armed){S.errors.splice(+b.dataset.edel,1);save();render()}else{b.dataset.armed="1";b.textContent="Yakin?"}}});
  }
  if($("syoSave")){
    $("syoSave").onclick=function(){
      SYNC={url:$("syUrl").value.trim(),key:$("syKey").value};
      try{localStorage.setItem(LS+"-sync",JSON.stringify(SYNC))}catch(e){}
      $("syMsg").textContent="Menguji koneksi...";
      pull().then(function(){$("syMsg").textContent=document.getElementById("sync").textContent==="Tersinkron"?"Terhubung.":"Gagal terhubung. Periksa alamat, kunci, dan pengaturan akses deployment."});
    };
    $("syoNow").onclick=function(){dirty=true;pull().then(flush)};
    $("bkOut").onclick=function(){var b=new Blob([JSON.stringify(S,null,1)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="jalur-ielts-cadangan-"+today()+".json";document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href)},2000)};
    $("bkIn").onchange=function(){var f=$("bkIn").files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var d=JSON.parse(r.result);if(!d||typeof d!=="object"||!d.cards)throw 0;S=normQ(Object.assign(def(),d));save();$("bkMsg").textContent="Cadangan dipulihkan.";render()}catch(e){$("bkMsg").textContent="File tidak valid."}};r.readAsText(f)};
  }
  document.querySelectorAll("[data-part]").forEach(function(b){b.onclick=function(){stopTimer();T.left=0;state.sp={part:+b.dataset.part,i:rnd(10),phase:"idle"};render()}});
  if($("spNext"))$("spNext").onclick=function(){stopTimer();T.left=0;var n=state.sp.part===2?SP2.length:state.sp.part===1?SP1.length:SP3.length;state.sp={part:state.sp.part,i:rnd(n,state.sp.i%n),phase:"idle"};render()};
  if($("spTime"))$("spTime").onclick=function(){startTimer(state.sp.part===1?30:60,function(){render()});};
  if($("spStart"))$("spStart").onclick=function(){
    state.sp.phase="prep";startTimer(60,function(){state.sp.phase="speak";render();startTimer(120,function(){state.sp.phase="done";render()})});render();
  };
}

render();
setSync(syncOn()?"busy":"off");
pull();
})();
</script>
