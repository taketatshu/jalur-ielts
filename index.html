<title>Jalur IELTS</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: departure-board header, ticket-style flashcards, one tab per skill. Blue signal + amber board text. */
:root{
  --bg:#EDF0F5; --surface:#FFFFFF; --ink:#0F1B2D; --muted:#58657A; --line:#D3D9E3;
  --accent:#1F4FD8; --accent-ink:#FFFFFF; --board:#101B2E; --board-ink:#F5B82E; --board-dim:#8FA0BA;
  --good:#12805C; --warn:#B26A00; --bad:#C23B3B; --soft:#E4EAF6;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A111C; --surface:#121C2B; --ink:#E7ECF4; --muted:#93A1B6; --line:#24344B;
  --accent:#7AA2FF; --accent-ink:#0A111C; --board:#060B13; --board-ink:#F2B93B; --board-dim:#6F8099;
  --good:#4FC79C; --warn:#E0A64A; --bad:#EF7B7B; --soft:#17243A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A111C; --surface:#121C2B; --ink:#E7ECF4; --muted:#93A1B6; --line:#24344B;
  --accent:#7AA2FF; --accent-ink:#0A111C; --board:#060B13; --board-ink:#F2B93B; --board-dim:#6F8099;
  --good:#4FC79C; --warn:#E0A64A; --bad:#EF7B7B; --soft:#17243A; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-block:0 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:860px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.15}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.board{background:var(--board);color:var(--board-ink);margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:18px max(16px,env(safe-area-inset-left,0px)) 16px}
.board .in{max-width:860px;margin:0 auto;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}
.board h1{font-size:30px;color:#fff;letter-spacing:-.01em}
.board .sub{font-family:var(--f-mono);font-size:12px;color:var(--board-dim);text-transform:uppercase;letter-spacing:.08em;margin-top:4px}
.board .wk{font-family:var(--f-mono);font-size:13px;text-align:right}
.board .wk b{display:block;font-size:22px;font-weight:500;color:var(--board-ink)}
.sync{font-family:var(--f-mono);font-size:11px;color:var(--board-dim);text-transform:uppercase;letter-spacing:.06em}

nav{display:flex;gap:2px;overflow-x:auto;margin:16px 0;border-bottom:1px solid var(--line)}
nav button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;color:var(--muted);font-weight:500;white-space:nowrap}
nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:16px;min-width:0}
.panel h2{font-size:18px;margin-bottom:10px}
.lbl{font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.big{font-family:var(--f-mono);font-size:30px;font-weight:500;line-height:1.1;margin-top:4px}
.small{font-size:13px;color:var(--muted)}

.today{display:grid;grid-template-columns:auto 1fr auto;gap:8px 16px;align-items:center}
.today .day{font-family:var(--f-mono);text-transform:uppercase;font-size:13px;color:var(--muted)}
.today .focus{font-family:var(--f-display);font-size:24px;font-weight:700}
@media (max-width:520px){.today{grid-template-columns:1fr}}

.btn{background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent);border-radius:4px;padding:9px 16px;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.good{background:var(--good);border-color:var(--good);color:#fff}
.btn.warn{background:transparent;border-color:var(--warn);color:var(--warn)}
.btn.bad{background:transparent;border-color:var(--bad);color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.week div{border:1px solid var(--line);border-radius:3px;padding:6px 2px;text-align:center;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.week div.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.week div.now{outline:2px solid var(--board-ink);outline-offset:1px}

.ticket{display:grid;grid-template-columns:96px 1fr;background:var(--surface);border:1px solid var(--line);border-radius:4px;min-height:230px}
.ticket .stub{background:var(--board);color:var(--board-ink);padding:14px 10px;font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;display:flex;flex-direction:column;justify-content:space-between;border-right:2px dashed var(--bg)}
.ticket .stub b{font-size:22px;font-weight:500;display:block;color:#fff}
.ticket .face{padding:20px;display:flex;flex-direction:column;justify-content:center;gap:10px;min-width:0}
.ticket .word{font-family:var(--f-display);font-size:34px;font-weight:700;overflow-wrap:anywhere}
.ticket .mean{font-size:20px;font-weight:600}
.ticket .ex{color:var(--muted);font-style:italic}
@media (max-width:520px){.ticket{grid-template-columns:1fr}.ticket .stub{flex-direction:row;border-right:0;border-bottom:2px dashed var(--bg);align-items:center}}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}

textarea,input[type=number],select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:10px;min-width:0}
textarea{min-height:260px;resize:vertical;line-height:1.6}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.timer{font-family:var(--f-mono);font-size:44px;font-weight:500;letter-spacing:.02em}
.timer.low{color:var(--bad)}
.card-cue{border:1px solid var(--line);border-left:4px solid var(--board-ink);padding:12px 16px;background:var(--soft);border-radius:3px}
.card-cue ul{margin:6px 0 0;padding-left:20px}

table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
th{font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:500}
td.n,th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:84px 1fr 36px;gap:8px;align-items:center;font-size:13px}
.bar i{display:block;height:10px;background:var(--soft);border-radius:2px;position:relative}
.bar i span{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:2px}
.bar i em{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--board-ink)}
svg text{font-family:var(--f-mono);font-size:11px}
.gl{stroke:var(--line);stroke-width:1}
.tx{fill:var(--muted)}
.ln{fill:none;stroke:var(--accent);stroke-width:2.5}
.dot{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.tg{stroke:var(--board-ink);stroke-width:2;stroke-dasharray:6 4}
.tgt{fill:var(--warn);font-weight:500}
.empty{padding:20px;border:1px dashed var(--line);border-radius:4px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:no-preference){.btn{transition:filter .15s}.btn:hover{filter:brightness(1.08)}}
@media (max-width:520px){.board .wk{text-align:left}}
.g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.prog{height:6px;background:var(--soft);border-radius:3px;margin:10px 0 14px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent)}
.passage{background:var(--soft);border:1px solid var(--line);border-radius:4px;padding:14px 16px;margin:0 0 14px;line-height:1.65}
.qh{font-family:var(--f-display);font-size:20px;font-weight:600;line-height:1.35;margin:6px 0 14px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:12px 14px;margin-bottom:8px;min-width:0}
.opt .ol{font-family:var(--f-mono);font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:3px;width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.opt span:last-child{overflow-wrap:anywhere;min-width:0}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt[disabled]{cursor:default;color:var(--ink);opacity:1}
.opt.right{border-color:var(--good);background:var(--soft)}
.opt.right .ol{background:var(--good);border-color:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad)}
.opt.wrong .ol{background:var(--bad);border-color:var(--bad);color:#fff}
.fb{margin-top:12px;padding:12px 14px;border-radius:4px;border-left:4px solid var(--good);background:var(--soft)}
.fb.no{border-left-color:var(--bad)}
</style>

</head>

function pad(n){return String(n).padStart(2,"0")}
function key(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function parse(k){var p=k.split("-").map(Number);return new Date(p[0],p[1]-1,p[2])}
function today(){return key(new Date())}
function addDays(k,n){var d=parse(k);d.setDate(d.getDate()+n);return key(d)}

function setSync(m){var e=document.getElementById("sync");if(!e)return;e.textContent=m==="ok"?"Tersinkron":m==="busy"?"Menyinkronkan...":m==="fail"?"Gagal sinkron, data aman di perangkat":"Sinkron belum diatur"}

function flush(){

function pull(){
  if(!syncOn()){setSync("off");return Promise.resolve()}

function buildQueue(){

  var left=Math.max(0,NEW_PER_DAY-(day().newSeen||0));

function dueCount(){return buildQueue().length}
function mastered(){var n=0;for(var k in S.cards){if(S.cards[k].box>=4)n++}return n}
function rate(r){
  var i=session.q[session.i],c=S.cards[i],t=today(),dd=day();
  if(!c){c={box:0,due:t};dd.newSeen=(dd.newSeen||0)+1}
  if(r==="again"){c.box=0;c.due=t;session.q.push(i)}
  else if(r==="hard"){c.box=Math.max(1,c.box);c.due=addDays(t,1)}
  else{c.box=Math.min(6,c.box+1);c.due=addDays(t,INTERVALS[c.box])}
  S.cards[i]=c;dd.reviewed=(dd.reviewed||0)+1;
  session.i++;session.flip=false;save();render();
}

/* timers */
var T={id:null,left:0,run:false,onEnd:null,el:null};
function stopTimer(){clearInterval(T.id);T.id=null;T.run=false}
function fmt(s){return pad(Math.floor(s/60))+":"+pad(s%60)}
function startTimer(sec,onEnd){stopTimer();T.left=sec;T.run=true;T.onEnd=onEnd;tickPaint();T.id=setInterval(function(){T.left--;tickPaint();if(T.left<=0){stopTimer();if(T.onEnd)T.onEnd()}},1000)}
function tickPaint(){var e=document.getElementById("timer");if(e){e.textContent=fmt(Math.max(0,T.left));e.classList.toggle("low",T.left<=60&&T.left>0&&state.tab==="tulis")}}

function rnd(n,not){var r;do{r=Math.floor(Math.random()*n)}while(n>1&&r===not);return r}

/* chart */
function chart(){
  var sc=S.scores.slice(-12),W=640,H=230,L=34,R=18,Tp=16,B=30,lo=4,hi=9;
  function y(v){v=Math.max(lo,Math.min(hi,v));return Tp+(hi-v)/(hi-lo)*(H-Tp-B)}
  function x(i){return sc.length<2?L+(W-L-R)/2:L+i*(W-L-R)/(sc.length-1)}
  var g="";
  for(var v=lo;v<=hi;v++){g+='<line class="gl" x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'"/><text class="tx" x="'+(L-8)+'" y="'+(y(v)+4)+'" text-anchor="end">'+v+'</text>'}
  g+='<line class="tg" x1="'+L+'" x2="'+(W-R)+'" y1="'+y(S.target)+'" y2="'+y(S.target)+'"/><text class="tgt" x="'+(W-R)+'" y="'+(y(S.target)-6)+'" text-anchor="end">target '+S.target+'</text>';
  if(sc.length){
    var pts=sc.map(function(s,i){return x(i)+","+y(avg(s))}).join(" ");
    g+='<polyline class="ln" points="'+pts+'"/>';
    sc.forEach(function(s,i){g+='<circle class="dot" cx="'+x(i)+'" cy="'+y(avg(s))+'" r="5"/>'});
    var last=sc[sc.length-1],lx=x(sc.length-1),ly=y(avg(last));
    g+='<text class="tx" x="'+(lx>W-60?lx-10:lx+10)+'" y="'+(ly-10)+'" text-anchor="'+(lx>W-60?"end":"start")+'" style="fill:var(--ink);font-weight:500">'+avg(last).toFixed(1)+'</text>';
    g+='<text class="tx" x="'+x(0)+'" y="'+(H-8)+'" text-anchor="'+(sc.length>1?"start":"middle")+'">'+sc[0].d.slice(5).split("-").reverse().join("/")+'</text>';
    if(sc.length>1)g+='<text class="tx" x="'+x(sc.length-1)+'" y="'+(H-8)+'" text-anchor="end">'+last.d.slice(5).split("-").reverse().join("/")+'</text>';
  }
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Grafik rata-rata band per tes dibanding target">'+g+'</svg>';
}

    return '<div class="panel"><h2>Kosakata hari ini selesai</h2><p>'+(session.total?session.total+' kartu sudah dikerjakan. ':'')+'Kartu baru dibatasi '+NEW_PER_DAY+' per hari supaya ulangan tetap ringan.'+(nxt&&nxt>today()?' Kartu berikutnya jatuh tempo '+nxt.slice(8)+'/'+nxt.slice(5,7)+'.':'')+'</p><button class="btn ghost" id="resetSess">Muat ulang antrean</button></div>';

var TFNG=["True","False","Not Given"];
var KIND={vocab:"Kosakata",grammar:"Tata bahasa",reading:"Reading mini"};
var KDESC={vocab:"Pilihan kata, kolokasi, phrasal verb, sinonim, dan bentuk kata. 25 soal per sesi.",grammar:"Tenses, kondisional, pasif, modal, inversi, klausa relatif, dan lainnya. 25 soal per sesi.",reading:"Lima bacaan pendek, masing-masing lima soal (True/False/Not Given dan pilihan ganda). 25 soal per sesi."};
var QI=[0,1,3,7,14,30];
var SESS=25,RSESS=5;
function D0(){return "2026-01-01"}
RP=RP.concat(RP2);
function qget(id){var r=S.q[id];if(!r)return null;if(r.length===4)return{box:r[0],due:addDays(D0(),r[1]),n:r[2],c:r[3]};return r}
function qset(id,r){S.q[id]=[r.box,diff(D0(),r.due),r.n,r.c]}
function normQ(o){var q=o.q||{};for(var k in q){var r=q[k];if(r&&!Array.isArray(r))q[k]=[r.box||0,diff(D0(),r.due||key(new Date())),r.n||0,r.c||0]}o.q=q;if(o.errors&&o.errors.length>100)o.errors=o.errors.slice(-100);return o}
var BANK=[],BID={};
VQ.forEach(function(r,i){BANK.push({id:"v"+(i+1),k:"vocab",lv:r[0],cat:"Pilihan kata",q:r[1],o:r[2],a:r[3],e:r[4]})});
GQ.forEach(function(r,i){BANK.push({id:"g"+(i+1),k:"grammar",lv:r[0],cat:r[1],q:r[2],o:r[3],a:r[4],e:r[5]})});
VQ2.forEach(function(r,i){BANK.push({id:"v"+(i+41),k:"vocab",lv:r[0],cat:r[1],q:r[2],o:r[3],a:r[4],e:r[5]})});
GQ2.forEach(function(r,i){BANK.push({id:"g"+(i+31),k:"grammar",lv:r[0],cat:r[1],q:r[2],o:r[3],a:r[4],e:r[5]})});
RP.forEach(function(p,pi){p.q.forEach(function(r,i){BANK.push({id:"r"+(pi+1)+"-"+(i+1),k:"reading",lv:p.l,cat:r[0]==="t"?"True/False/Not Given":"Pilihan ganda",q:r[1],o:r[0]==="t"?TFNG:r[2],a:r[3],e:r[4],p:pi,tf:r[0]==="t"})})});
BANK.forEach(function(x){BID[x.id]=x});
var qs=null;

function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function makePerm(it){if(it.tf)return[0,1,2];return shuf(it.o.map(function(_,i){return i}))}
function qstat(kind,lv){var n=0,c=0,seen=0,tot=0;BANK.forEach(function(x){if((kind&&x.k!==kind)||(lv!=="all"&&x.lv!==lv))return;tot++;var r=qget(x.id);if(r){seen++;n+=r.n;c+=r.c}});return{n:n,c:c,seen:seen,tot:tot}}
function pct(c,n){return n?Math.round(c/n*100)+"%":"--"}
function weakCat(){var m={},w=null;BANK.forEach(function(x){if(x.k!=="grammar")return;var r=qget(x.id);if(!r)return;var o=m[x.cat]||(m[x.cat]={n:0,c:0});o.n+=r.n;o.c+=r.c});Object.keys(m).forEach(function(k){if(m[k].n>=3&&(!w||m[k].c/m[k].n<m[w].c/m[w].n))w=k});return w?{cat:w,acc:pct(m[w].c,m[w].n)}:null}

function pickItems(kind,lv){
  var t=today(),pool=BANK.filter(function(x){return x.k===kind&&(lv==="all"||x.lv===lv)});
  if(kind==="reading"){
    var ps={},sc=[];
    pool.forEach(function(x){(ps[x.p]=ps[x.p]||[]).push(x)});
    Object.keys(ps).forEach(function(k){var s=0;ps[k].forEach(function(x){var r=qget(x.id);if(!r)s+=2;else if(r.due<=t)s+=3});sc.push({k:k,s:s+Math.random()})});
    sc.sort(function(a,b){return b.s-a.s});
    return sc.slice(0,RSESS).reduce(function(a,o){return a.concat(ps[o.k])},[]);
  }
  var due=[],fresh=[],rest=[];
  pool.forEach(function(x){var r=qget(x.id);if(!r)fresh.push(x);else if(r.due<=t)due.push(x);else rest.push(x)});
  return shuf(due).concat(shuf(fresh),shuf(rest)).slice(0,SESS);
}
function startQuiz(kind){
  var items=pickItems(kind,state.ql||"all");
  if(!items.length){qs=null;return}
  qs={kind:kind,items:items,i:0,picked:null,ok:false,perm:makePerm(items[0]),res:[],done:false};
}
function answer(idx){
  if(!qs||qs.picked!==null)return;
  var it=qs.items[qs.i],ok=qs.perm[idx]===it.a,r=qget(it.id)||{box:0,due:today(),n:0,c:0};
  qs.picked=idx;qs.ok=ok;
  r.n++;
  if(ok){r.c++;r.box=Math.min(5,r.box+1);r.due=addDays(today(),QI[r.box])}else{r.box=0;r.due=today()}
  qset(it.id,r);
  qs.res.push({id:it.id,ok:ok});
  var dd=day();dd.quiz=(dd.quiz||0)+1;
  if(!ok){S.errors.push({d:today(),s:KIND[it.k],t:it.cat,n:it.q.slice(0,50)});if(S.errors.length>100)S.errors.splice(0,S.errors.length-100)}
  save();render();
}
function nextQ(){
  qs.i++;
  if(qs.i>=qs.items.length){
    qs.done=true;
    var c=qs.res.filter(function(r){return r.ok}).length;
    S.ql.push({d:today(),k:qs.kind,n:qs.res.length,c:c});
    if(S.ql.length>40)S.ql.splice(0,S.ql.length-40);
    save();
  }else{qs.picked=null;qs.perm=makePerm(qs.items[qs.i])}
  render();
  var v=document.getElementById("view");if(v&&v.scrollIntoView)v.scrollIntoView();
}

  var $=function(id){return document.getElementById(id)};
  if(state.tab==="soal")bindSoal();
  document.querySelectorAll("[data-tab]").forEach(function(b){b.onclick=function(){go(b.dataset.tab)}});
  document.querySelectorAll("[data-go]").forEach(function(b){b.onclick=function(){go(b.dataset.go)}});
  if($("doneBtn"))$("doneBtn").onclick=function(){var d=day();d.done=!d.done;save();render()};
  document.querySelectorAll("[data-r]").forEach(function(b){b.onclick=function(){rate(b.dataset.r)}});
  if($("flip"))$("flip").onclick=function(){session.flip=true;render()};
  if($("resetSess"))$("resetSess").onclick=function(){session=null;render()};
  if($("scoreForm")){
    var f=$("scoreForm");
    var prev=function(){var v=["L","R","W","S"].map(function(k){return parseFloat($("s"+k).value)});if(v.every(function(x){return !isNaN(x)}))$("avgPrev").textContent="Rata-rata: "+avg({L:v[0],R:v[1],W:v[2],S:v[3]}).toFixed(1)};
    f.oninput=prev;
    f.onsubmit=function(e){e.preventDefault();var v=["L","R","W","S"].map(function(k){return Math.max(0,Math.min(9,Math.round(parseFloat($("s"+k).value)*2)/2))});if(v.some(isNaN))return;S.scores.push({d:today(),L:v[0],R:v[1],W:v[2],S:v[3]});save();render()};
    $("tgt").onchange=function(){var v=parseFloat($("tgt").value);if(v>=4&&v<=9){S.target=Math.round(v*2)/2;save();render()}};
    document.querySelectorAll("[data-del]").forEach(function(b){b.onclick=function(){if(b.dataset.armed){S.scores.splice(+b.dataset.del,1);save();render()}else{b.dataset.armed="1";b.textContent="Yakin?";}}});
  }
  if($("essay")){
    var ta=$("essay");
    ta.oninput=function(){state.draft=ta.value;try{localStorage.setItem(LS+"-draft",state.draft)}catch(e){}var n=state.draft.trim()?state.draft.trim().split(/\s+/).length:0;$("wc").textContent=n+" kata"};
    $("newPrompt").onclick=function(){state.wp=rnd(WRITING.length,state.wp);$("prompt").textContent=WRITING[state.wp]};
    $("tStart").onclick=function(){
      if(T.run){stopTimer();render();return}
      startTimer(T.left>0?T.left:2400,function(){render()});render();
    };
    $("tReset").onclick=function(){stopTimer();T.left=0;render()};
    $("clearEssay").onclick=function(){state.draft="";try{localStorage.removeItem(LS+"-draft")}catch(e){}render()};
    $("copyEssay").onclick=function(){
      var txt="Soal: "+WRITING[state.wp]+"\n\nEsai saya ("+(state.draft.trim()?state.draft.trim().split(/\s+/).length:0)+" kata):\n"+state.draft+"\n\nTolong nilai berdasarkan band descriptor IELTS Writing Task 2 (Task Response, Coherence, Lexical Resource, Grammar) dan beri 3 perbaikan terpenting.";
      var done=function(ok){$("copyMsg").textContent=ok?"Tersalin. Tempel ke obrolan dengan Claude.":"Gagal menyalin otomatis. Blok teks esai lalu salin manual."};
      if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(function(){done(true)},function(){done(false)});else done(false);
    };
  }
  if($("errForm")){
    $("eS").onchange=function(){state.errSkill=$("eS").value;render()};
    $("errForm").onsubmit=function(e){e.preventDefault();S.errors.push({d:today(),s:$("eS").value,t:$("eT").value,n:$("eN").value.trim()});save();render()};
    document.querySelectorAll("[data-edel]").forEach(function(b){b.onclick=function(){if(b.dataset.armed){S.errors.splice(+b.dataset.edel,1);save();render()}else{b.dataset.armed="1";b.textContent="Yakin?"}}});
  }
  if($("syoSave")){
    $("syoSave").onclick=function(){
      SYNC={url:$("syUrl").value.trim(),key:$("syKey").value};
      try{localStorage.setItem(LS+"-sync",JSON.stringify(SYNC))}catch(e){}
      $("syMsg").textContent="Menguji koneksi...";
      pull().then(function(){$("syMsg").textContent=document.getElementById("sync").textContent==="Tersinkron"?"Terhubung.":"Gagal terhubung. Periksa alamat, kunci, dan pengaturan akses deployment."});
    };
    $("syoNow").onclick=function(){dirty=true;pull().then(flush)};
    $("bkOut").onclick=function(){var b=new Blob([JSON.stringify(S,null,1)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="jalur-ielts-cadangan-"+today()+".json";document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href)},2000)};
    $("bkIn").onchange=function(){var f=$("bkIn").files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var d=JSON.parse(r.result);if(!d||typeof d!=="object"||!d.cards)throw 0;S=normQ(Object.assign(def(),d));save();$("bkMsg").textContent="Cadangan dipulihkan.";render()}catch(e){$("bkMsg").textContent="File tidak valid."}};r.readAsText(f)};
  }
  document.querySelectorAll("[data-part]").forEach(function(b){b.onclick=function(){stopTimer();T.left=0;state.sp={part:+b.dataset.part,i:rnd(10),phase:"idle"};render()}});
  if($("spNext"))$("spNext").onclick=function(){stopTimer();T.left=0;var n=state.sp.part===2?SP2.length:state.sp.part===1?SP1.length:SP3.length;state.sp={part:state.sp.part,i:rnd(n,state.sp.i%n),phase:"idle"};render()};
  if($("spTime"))$("spTime").onclick=function(){startTimer(state.sp.part===1?30:60,function(){render()});};
  if($("spStart"))$("spStart").onclick=function(){
    state.sp.phase="prep";startTimer(60,function(){state.sp.phase="speak";render();startTimer(120,function(){state.sp.phase="done";render()})});render();
  };
}

render();
setSync(syncOn()?"busy":"off");
pull();
})();
</script>

</body>
</html>
